<style>
:root{
  --bg:#FFF6E9;--surface:#FFFFFF;--surface2:#FFF0DA;--ink:#4A2C2A;--muted:#8A6A5A;--accent:#D9731A;--on-accent:#FFFFFF;--deep:#8C2F39;--line:#EFDFC9;
  --head:"Marcellus",Georgia,serif;--head-scale:1;--body:"Mukta","Segoe UI",system-ui,sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1F1512;--surface:#2B1E19;--surface2:#3A2820;--ink:#F6E6D2;--muted:#C2A48E;--accent:#F0943A;--on-accent:#1F1512;--deep:#F2A0A8;--line:#4A3328;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1F1512;--surface:#2B1E19;--surface2:#3A2820;--ink:#F6E6D2;--muted:#C2A48E;--accent:#F0943A;--on-accent:#1F1512;--deep:#F2A0A8;--line:#4A3328;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--head);font-weight:500;line-height:1.15;margin:0;color:var(--deep)}
h1{font-size:calc(1.9rem*var(--head-scale))}
h2{font-size:calc(1.35rem*var(--head-scale))}
h3{font-size:calc(1.1rem*var(--head-scale))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:1fr;min-height:100vh}
.side{display:none}
main{padding:20px 18px 110px;max-width:760px;width:100%;margin:0 auto}
@media (min-width:900px){
  .app{grid-template-columns:230px 1fr}
  .side{display:flex;flex-direction:column;gap:2px;padding:24px 14px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto}
  .tabbar{display:none!important}
  main{padding:36px 40px 60px}
}
.brand{font-family:var(--head);font-size:calc(1.35rem*var(--head-scale));color:var(--deep);padding:4px 10px 16px}
.nav a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--ink)}
.nav a:hover{background:var(--surface2)}
.nav a.on{background:var(--accent);color:var(--on-accent)}
.nav .em{width:22px;text-align:center}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;font-size:12px;text-decoration:none;color:var(--muted);padding:4px 0;border-radius:10px}
.tabbar a .em{font-size:20px;line-height:1.2}
.tabbar a.on{color:var(--deep);font-weight:600}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.sub{color:var(--muted);margin:4px 0 0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;cursor:pointer;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}
.btn.sm{padding:5px 12px;font-size:14px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:#B23A48}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.list{display:grid;gap:10px}
.card.click{cursor:pointer}
.card.click:hover{border-color:var(--accent)}
.card h3{margin-bottom:2px}
.meta{color:var(--muted);font-size:14px}
.chip{display:inline-block;background:var(--surface2);color:var(--deep);border-radius:999px;padding:1px 10px;font-size:13px;font-weight:500}

.tabs{display:flex;gap:6px;margin:0 0 14px;overflow-x:auto;padding-bottom:2px}
.tabs button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 14px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--deep);border-color:var(--deep);color:var(--bg)}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty .big{font-size:40px}
.stars{color:var(--accent);letter-spacing:1px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;margin-bottom:14px}
/* home */
.hello{margin-bottom:18px}
.joy{position:relative;background:var(--surface2);border-radius:18px;padding:22px 20px 18px;margin-bottom:16px;overflow:hidden}
.joy::before{content:"";position:absolute;inset:auto -30px -40px auto;width:140px;height:140px;border-radius:50%;background:var(--accent);opacity:.12}
.joy .lab{font-size:14px;color:var(--deep);font-weight:600}
.joy .txt{font-family:var(--head);font-size:calc(1.35rem*var(--head-scale));line-height:1.3;margin:8px 0 6px;color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.stat{font-family:var(--head);font-size:calc(2rem*var(--head-scale));color:var(--deep);line-height:1.1}
.tile h3{font-size:calc(1rem*var(--head-scale));margin-bottom:8px}
.more{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.more a{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.more a .em{font-size:26px}
/* todo */
.datenav{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;margin-bottom:14px}
.datenav button{border:0;background:var(--surface2);width:40px;height:40px;border-radius:10px;cursor:pointer;font-size:18px}
.datenav button:disabled{opacity:.35;cursor:default}
.datenav .d{text-align:center;cursor:pointer}
.datenav .d b{display:block;font-family:var(--head);font-weight:500;font-size:calc(1.1rem*var(--head-scale));color:var(--deep)}
.datenav .d span{font-size:13px;color:var(--muted)}
.todo{display:flex;align-items:center;gap:12px;padding:10px 12px}
.todo input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
.todo .t{flex:1}
.todo.done .t{text-decoration:line-through;color:var(--muted)}
.add{display:flex;gap:8px;margin-bottom:14px}
.add input{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px}
/* mala */
.counter{display:flex;flex-direction:column;align-items:center;gap:14px;margin:8px 0 18px}
.bead{width:min(72vw,280px);aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;background:var(--surface);position:relative;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.bead svg{position:absolute;inset:0;transform:rotate(-90deg)}
.bead .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bead .n{font-family:var(--head);font-size:calc(3.4rem*var(--head-scale));color:var(--deep);line-height:1}
.bead:active{transform:scale(.98)}
.mtext{white-space:pre-line;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;max-height:260px;overflow-y:auto;font-size:15px}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.dots i{width:12px;height:12px;border-radius:3px;background:var(--line)}
.dots i.ok{background:var(--accent)}
.dots i.today{outline:2px solid var(--deep);outline-offset:1px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent)}

.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:14px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;width:100%}
.field textarea{min-height:84px;resize:vertical}
.rate{display:flex;gap:4px}
.rate button{border:0;background:none;font-size:26px;cursor:pointer;color:var(--line);padding:0 2px}
.rate button.on{color:var(--accent)}
.err{color:#B23A48;font-size:14px;margin:-4px 0 10px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--deep);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:15px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}
.cook{font-size:21px;line-height:1.7;white-space:pre-line}
.letter{background:var(--surface2);border-radius:14px;padding:18px;white-space:pre-line;font-family:var(--head);font-size:calc(1.1rem*var(--head-scale));line-height:1.6}
.seal{font-size:34px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sw{border-radius:14px;padding:12px;cursor:pointer;border:2px solid transparent;text-align:left}
.sw.on{border-color:var(--accent)}
.sw .pal{display:flex;gap:4px;margin-top:8px}
.sw .pal i{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.08)}
.sec{margin:26px 0 10px}
[data-skin="scrapbook"] .card:nth-child(4n+1){transform:rotate(-.35deg)}
[data-skin="scrapbook"] .card:nth-child(4n+3){transform:rotate(.3deg)}
.gate{position:fixed;inset:0;background:var(--bg);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.gate.hidden{display:none}
.gate .box{max-width:380px}
.gate .lotus{font-size:54px}
.gate h1{margin:10px 0 6px}
.gate p{color:var(--muted)}
.gbtn{display:inline-flex;align-items:center;gap:10px;margin-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  const P=Array.from({length:110},()=>({x:W/2,y:H*.62,vx:(Math.random()-.5)*16*devicePixelRatio,vy:-(Math.random()*15+7)*devicePixelRatio,s:(Math.random()*6+4)*devicePixelRatio,r:Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)].trim(),f:Math.random()<.35}));

/* ============ Mala ============ */
let malaDate=today(),malaSel=null,showText=false,wake=null;
const findM=id=>DB.mala.malas.find(m=>m.id===id);
function recount(m){let t=0,k=0;Object.values(m.days||{}).forEach(v=>{t+=v.b||0;k+=v.m||0});m.total=t;m.malas=k}
function chal(m){
  if(!m.goal||!m.goal.days)return null;const g=m.goal,done=[];
  for(let i=0;i<g.days;i++){const d=addDays(g.start,i);done.push({d,ok:((m.days||{})[d]?.m||0)>=(g.malas||1)})}
  const dn=Math.min(Math.max(diffDays(g.start,today())+1,0),g.days);
  return{list:done,ok:done.filter(x=>x.ok).length,dayNo:dn,days:g.days};
}
function malaList(){
  const t=malaDate;
  return `<div class="top"><div><h1>📿 Mala & Mantra</h1><p class="sub">${streak()} day streak · ${DB.mala.malas.reduce((s,m)=>s+(m.malas||0),0)} malas in total</p></div><button class="btn pri" data-act="newMala">Add a mantra</button></div>
  ${dateNav(t,'mala',true)}
  <div class="list">${DB.mala.malas.map(m=>{const d=(m.days||{})[t]||{b:0,m:0},c=chal(m);return `<div class="card click" data-open="${m.id}"><h3>${esc(m.name)}</h3><div class="meta">${d.m} malas · ${d.b} beads on ${dayLabel(t).toLowerCase()} · ${m.per} beads per mala</div>${c?`<div class="meta" style="margin-top:6px">Challenge: day ${c.dayNo} of ${c.days} · ${c.ok} days done</div><div class="bar"><i style="width:${Math.round(c.ok/c.days*100)}%"></i></div>`:''}</div>`}).join('')||`<div class="empty"><div class="big">📿</div><p>Add your first mantra to start counting.</p></div>`}</div>`;
}
function malaCounter(){
  const m=findM(malaSel);if(!m){malaSel=null;return malaList()}
  const d=(m.days||{})[malaDate]||{b:0,m:0},cur=d.b%m.per,c=chal(m),R=46,C=2*Math.PI*R;
  return `<div class="top"><div><button class="btn ghost sm" data-act="malaBack" style="padding-left:0">‹ All mantras</button><h1>${esc(m.name)}</h1>${m.intention?`<p class="sub">${esc(m.intention)}</p>`:''}</div><button class="btn sm" data-act="editMala">Edit</button></div>
  ${dateNav(malaDate,'mala',true)}
  <div class="counter">
   <button class="bead" data-act="tap" aria-label="Count one bead"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-cur/m.per)}"/></svg>
   <span class="in"><span class="n">${cur}</span><span class="meta">of ${m.per}</span><span style="margin-top:6px;font-weight:600;color:var(--deep)">${d.m} malas</span></span></button>
   <div class="row" style="justify-content:center"><button class="btn sm" data-act="undo">− 1 bead</button><button class="btn sm" data-act="editCount">Change count</button><button class="btn sm" data-act="toggleText">${showText?'Hide':'Show'} mantra</button></div>
   <div class="meta">${dayLabel(malaDate)}: ${d.b} beads${malaDate!==today()?' · you’re adding to this day':''}</div>
  </div>
  ${showText&&m.mantra?`<div class="mtext">${esc(m.mantra)}</div>`:''}
  ${c?`<h3 class="sec">Challenge</h3><div class="card"><div>${c.ok} of ${c.days} days done · ${m.goal.malas||1} mala${(m.goal.malas||1)>1?'s':''} a day · started ${fmt(m.goal.start)}</div><div class="dots">${c.list.map(x=>`<i class="${x.ok?'ok':''} ${x.d===today()?'today':''}" title="${fmt(x.d)}"></i>`).join('')}</div></div>`:''}`;
}
function malaTap(n){
  const m=findM(malaSel);if(!m)return;m.days=m.days||{};const d=m.days[malaDate]||{b:0,m:0};
  const before=d.m;d.b=Math.max(0,d.b+n);d.m=Math.floor(d.b/m.per);m.days[malaDate]=d;if(d.b===0)delete m.days[malaDate];
  m.last=Date.now();recount(m);save();render();
  if(d.m>before){const c=chal(m);celebrate(c&&c.list.find(x=>x.d===malaDate&&x.ok)&&d.m===(m.goal.malas||1)?'Challenge day complete 🙏':'Mala complete 🙏')}
  else if(n>0&&navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
}
async function keepAwake(on){try{if(on&&!wake&&navigator.wakeLock)wake=await navigator.wakeLock.request('screen');if(!on&&wake){wake.release();wake=null}}catch(e){}}
function malaForm(m){
  const g=m&&m.goal||{};
  openSheet(`<h2 style="margin-bottom:14px">${m?'Edit mantra':'Add a mantra'}</h2>
  ${fieldHTML({k:'name',l:'Name',t:'text'},m&&m.name)}${fieldHTML({k:'mantra',l:'Mantra text',t:'textarea'},m&&m.mantra)}${fieldHTML({k:'intention',l:'My intention',t:'text'},m&&m.intention)}${fieldHTML({k:'per',l:'Beads per mala',t:'number'},m?m.per:108)}

  <div class="err" id="ferr"></div>

  const tb=e.target.closest('[data-tab]');if(tb){tabState[tb.dataset.tab]=tb.dataset.v;render();return}
  const tp=e.target.closest('[data-theme-pick]');if(tp){DB.settings.theme=tp.dataset.themePick;save();applyTheme();render();return}
  const dn=e.target.closest('[data-dn]');if(dn&&!dn.disabled){const n=+dn.dataset.dn;if(route()==='todo')todoDate=addDays(todoDate,n);else{const nd=addDays(malaDate,n);if(nd<=today())malaDate=nd}render();return}
  const hit=e.target.closest('[data-hit]');if(hit){const k=hit.dataset.hit,id=hit.dataset.id;if(k==='mala'){malaSel=id;location.hash='mala'}else if(k==='todo'){const t=DB.items.todo.find(i=>i.id===id);todoDate=t.date;location.hash='todo'}else{location.hash=k;setTimeout(()=>formSheet(k,DB.items[k].find(i=>i.id===id)),30)}return}
  const op=e.target.closest('[data-open]');if(op){malaSel=op.dataset.open;showText=false;render();window.scrollTo(0,0);return}
  const ed=e.target.closest('[data-edit]');if(ed&&!e.target.closest('[data-act]')){const k=ed.dataset.edit;formSheet(k,DB.items[k].find(i=>i.id===ed.dataset.id));return}
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,id=a.dataset.id;
  switch(act){
   case'close':closeSheet();break;
   case'new':formSheet(a.dataset.sec);break;
   case'saveItem':saveItem(a.dataset.sec,id,a.dataset.from);break;
   case'del':if(confirm('Delete this for good?')){const k=a.dataset.sec;DB.items[k]=DB.items[k].filter(i=>i.id!==id);save();closeSheet();render();toast('Deleted')}break;
   case'joy':{const J=joys();if(J.length>1){let p;do{p=J[Math.floor(Math.random()*J.length)]}while(p.txt===joyPick.txt);joyPick=p}render();break}
   case'remindWin':{const W=DB.items.wins;if(!W.length){toast('Add a win first');break}const w=W[Math.floor(Math.random()*W.length)];
     openSheet(`<div class="meta">${esc(w.kind||'Win')} · ${fmt(w.date)}</div><h2 style="margin:6px 0 14px">${esc(w.title)}</h2>${w.hoped?`<p><b>I was hoping for</b><br>${esc(w.hoped)}</p>`:''}${w.did?`<p><b>What I did</b><br>${esc(w.did)}</p>`:''}${w.outcome?`<p><b>How it worked out</b><br>${esc(w.outcome)}</p>`:''}${w.thanks?`<div class="letter">${esc(w.thanks)}</div>`:''}<div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn" data-act="remindWin">Another one</button><button class="btn pri" data-act="close">Thank you</button></div>`);break}
   case'pickIdea':{const I=DB.items.ideas;if(!I.length){toast('Add an idea first');break}const p=I[Math.floor(Math.random()*I.length)];
     openSheet(`<div class="meta">Your next solo date</div><h2 style="margin:6px 0 10px">${esc(p.title)}</h2>${p.notes?`<p class="meta">${esc(p.notes)}</p>`:''}<div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-act="pickIdea">Pick another</button><button class="btn pri" data-act="didIdea" data-id="${p.id}">I did this</button></div>`);break}
   case'didIdea':{const p=DB.items.ideas.find(i=>i.id===id);formSheet('dates',null,{title:p.title,what:p.notes,_from:p.id});break}
   case'gotIt':{const it=DB.items.wishlist.find(i=>i.id===id);it.status='got';it.doneOn=today();save();render();celebrate('Treat yourself! 🎁');break}
   case'bucketDone':{const it=DB.items.bucket.find(i=>i.id===id);openSheet(`<h2 style="margin-bottom:6px">You did it!</h2><p class="meta" style="margin:0 0 14px">${esc(it.title)}</p>${fieldHTML({k:'feeling',l:'How did it feel?',t:'textarea'})}<div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Cancel</button><button class="btn pri" data-act="bucketSave" data-id="${id}">Tick it off</button></div>`);break}
   case'bucketSave':{const it=DB.items.bucket.find(i=>i.id===id);it.feeling=$('#f_feeling').value.trim();it.status='done';it.doneOn=today();save();closeSheet();render();celebrate('A dream made real 🌍');break}
   case'cook':{const r=DB.items.recipes.find(i=>i.id===id);keepAwake(true);openSheet(`<h2>${esc(r.title)}</h2>${r.time?`<p class="meta">${esc(r.time)}</p>`:''}${r.ingredients?`<h3 class="sec">Ingredients</h3><div class="cook">${esc(r.ingredients)}</div>`:''}${r.steps?`<h3 class="sec">Steps</h3><div class="cook">${esc(r.steps).split('\n').filter(x=>x.trim()).map((s,n)=>`<b style="color:var(--accent)">${n+1}.</b> ${s}`).join('\n')}</div>`:''}${r.tips?`<h3 class="sec">My tips</h3><div class="cook" style="font-size:18px">${esc(r.tips)}</div>`:''}<div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn pri" data-act="close">Done cooking</button></div>`);break}
   case'addTodo':addTodo();break;
   case'delTodo':DB.items.todo=DB.items.todo.filter(i=>i.id!==id);save();render();break;
   case'moveTodo':{const t=DB.items.todo.find(i=>i.id===id);t.date=today();save();render();break}
   case'todoToday':todoDate=today();render();break;
   case'pickDate':{const cur=route()==='todo'?todoDate:malaDate;openSheet(`<h2 style="margin-bottom:14px">Go to a date</h2>${fieldHTML({k:'jd',l:'Date',t:'date'},cur)}<div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Cancel</button><button class="btn pri" data-act="jumpDate">Go</button></div>`);break}
   case'jumpDate':{const v=$('#f_jd').value;if(v){if(route()==='todo')todoDate=v;else malaDate=v>today()?today():v}closeSheet();render();break}
   case'malaBack':malaSel=null;render();break;
   case'tap':malaTap(1);break;
   case'undo':malaTap(-1);break;
   case'toggleText':showText=!showText;render();break;
   case'editCount':{const m=findM(malaSel),d=(m.days||{})[malaDate]||{b:0};openSheet(`<h2 style="margin-bottom:6px">Change count</h2><p class="meta" style="margin:0 0 14px">${esc(m.name)} · ${fmt(malaDate)}</p><div class="grid2" style="grid-template-columns:1fr 1fr;gap:0 12px">${fieldHTML({k:'cm',l:'Full malas',t:'number'},Math.floor(d.b/m.per))}${fieldHTML({k:'cb',l:'Extra beads',t:'number'},d.b%m.per)}</div><div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Cancel</button><button class="btn pri" data-act="saveCount">Save</button></div>`);break}
   case'saveCount':{const m=findM(malaSel);const b=Math.max(0,(+$('#f_cm').value||0)*m.per+(+$('#f_cb').value||0));m.days=m.days||{};if(b)m.days[malaDate]={b,m:Math.floor(b/m.per)};else delete m.days[malaDate];recount(m);save();closeSheet();render();toast('Count updated');break}
   case'newMala':malaForm(null);break;
   case'editMala':malaForm(findM(malaSel));break;
   case'saveMala':{const v=readFields([{k:'name'},{k:'mantra'},{k:'intention'},{k:'per',t:'number'},{k:'gdays',t:'number'},{k:'gmalas',t:'number'},{k:'gstart'}]);if(!v.name){$('#ferr').textContent='Give your mantra a name.';break}
     const per=Math.max(1,v.per||108),goal=v.gdays?{days:v.gdays,malas:Math.max(1,v.gmalas||1),start:v.gstart||today()}:null;
     if(id){const m=findM(id);Object.assign(m,{name:v.name,mantra:v.mantra,intention:v.intention,per,goal});Object.values(m.days||{}).forEach(d=>d.m=Math.floor(d.b/per));recount(m)}
     else{const m={id:uid(),name:v.name,mantra:v.mantra,intention:v.intention,per,goal,days:{},sessions:[],created:Date.now(),total:0,malas:0};DB.mala.malas.push(m);malaSel=m.id}
     save();closeSheet();render();toast('Saved');break}
   case'delMala':if(confirm('Delete this mantra and all its counts?')){DB.mala.malas=DB.mala.malas.filter(m=>m.id!==malaSel);malaSel=null;save();closeSheet();render()}break;
   case'newLetter':openSheet(`<h2 style="margin-bottom:14px">Dear future me…</h2>${fieldHTML({k:'lt',l:'Title',t:'text',ph:'For New Year’s 2027'})}${fieldHTML({k:'lb',l:'Your letter',t:'textarea'})}${fieldHTML({k:'lo',l:'Open on',t:'date'},addDays(today(),30))}<p class="meta" style="margin-top:-4px">Once sealed, you won’t see it again until that date.</p><div class="err" id="ferr"></div><div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Cancel</button><button class="btn pri" data-act="sealLetter">Seal it 💌</button></div>`);$('#f_lb').style.minHeight='180px';break;
   case'sealLetter':{const t=$('#f_lt').value.trim()||'A letter to me',b=$('#f_lb').value.trim(),o=$('#f_lo').value;if(!b){$('#ferr').textContent='Write your letter first.';break}if(!o||o<=today()){$('#ferr').textContent='Pick a date after today.';break}DB.items.letters.push({id:uid(),created:Date.now(),title:t,body:b,openOn:o,written:today(),opened:false});save();closeSheet();render();celebrate('Sealed until '+fmt(o));break}
   case'openLetter':{const l=DB.items.letters.find(i=>i.id===id);const first=!l.opened;l.opened=true;save();openSheet(`<div class="meta">Written ${fmt(l.written)}</div><h2 style="margin:6px 0 14px">${esc(l.title)}</h2><div class="letter">${esc(l.body)}</div><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn pri" data-act="close">Close</button></div>`);if(first)celebrate();render();break}
   case'delLetter':if(confirm('Delete this letter?')){DB.items.letters=DB.items.letters.filter(i=>i.id!==id);save();render()}break;
   case'signOut':if(confirm('Sign out on this device?')){flush();firebase.auth().signOut().then(()=>{try{localStorage.removeItem(KEY)}catch(e){}location.reload()})}break;
   case'revY':revYear+=+a.dataset.d;render();break;
   case'newTheme':themeForm();break;
   case'editTheme':themeForm(DB.settings.custom.find(c=>c.id===DB.settings.theme));break;
   case'saveTheme':{const g=k=>$('#t_'+k).value;const c={id:id||'c_'+uid(),name:g('name').trim()||'My theme',bg:g('bg'),surface:g('surface'),accent:g('accent'),deep:g('deep'),ink:g('ink'),font:g('font')};
     if(id){Object.assign(DB.settings.custom.find(x=>x.id===id),c)}else DB.settings.custom.push(c);DB.settings.theme=c.id;save();applyTheme();closeSheet();render();toast('Theme saved');break}
   case'delTheme':DB.settings.custom=DB.settings.custom.filter(c=>c.id!==id);DB.settings.theme='diya';save();applyTheme();closeSheet();render();break;
   case'export':{try{const b=new Blob([backupText()],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download='my-little-world-'+today()+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Backup downloaded')}catch(err){toast('Use “Copy backup text” instead')}break}
   case'copyBk':openSheet(`<h2 style="margin-bottom:10px">Your backup</h2><p class="meta" style="margin:0 0 10px">Copy this and keep it somewhere safe.</p><textarea id="bkt" class="search" style="min-height:200px" readonly>${esc(backupText())}</textarea><div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Close</button><button class="btn pri" data-act="doCopy">Copy</button></div>`);break;
   case'doCopy':{const t=$('#bkt');t.select();try{await navigator.clipboard.writeText(t.value);toast('Copied')}catch(err){document.execCommand('copy');toast('Copied')}break}
   case'restore':openSheet(`<h2 style="margin-bottom:10px">Restore a backup</h2><p class="meta" style="margin:0 0 10px">Paste a backup from this app or from your old Mala & Mantra page. This replaces what’s here now.</p><textarea id="rst" class="search" style="min-height:180px"></textarea><div class="err" id="ferr"></div><div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Cancel</button><button class="btn pri" data-act="doRestore">Restore</button></div>`);break;
   case'doRestore':{try{const o=JSON.parse($('#rst').value);
     if(o.app==='my-little-world'&&o.data){DB=o.data}else if(Array.isArray(o.malas)){DB.mala.malas=o.malas}else throw 0;
     save();applyTheme();closeSheet();render();toast('Restored')}catch(err){$('#ferr').textContent='That doesn’t look like a backup. Paste the whole text, from the first { to the last }.'}break}
  }
});
/* ============ Start-up and sign-in ============ */
applyTheme();
const gate=$('#gate'),gMsg=$('#gateMsg'),gBtn=$('#gBtn');
function showSignIn(msg){gMsg.textContent=msg||'Sign in to see your wins, malas and memories on any device.';gBtn.style.display='inline-flex'}
gBtn.onclick=async()=>{
  const p=new firebase.auth.GoogleAuthProvider();gMsg.textContent='Signing you in…';
  try{await firebase.auth().signInWithPopup(p)}
  catch(e){if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){firebase.auth().signInWithRedirect(p)}
    else if(e.code==='auth/unauthorized-domain')showSignIn('This web address isn’t allowed yet. In Firebase, add it under Authentication → Settings → Authorized domains.');
    else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')showSignIn('Sign-in didn’t work ('+e.code+'). Try again.');
    else showSignIn()}
};
if(firebaseConfig.apiKey.startsWith('PASTE')){
  gMsg.innerHTML='Almost there. Paste your Firebase config at the top of <b>index.html</b> (look for “STEP 1”) and upload it again.';
}else{
  firebase.initializeApp(firebaseConfig);
  const fs=firebase.firestore();
  fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  firebase.auth().getRedirectResult().catch(e=>showSignIn('Sign-in didn’t work ('+e.code+'). Try again.'));
  firebase.auth().onAuthStateChanged(async u=>{
    if(!u){USER=null;COL=null;showSignIn();return}
    USER=u;gBtn.style.display='none';gMsg.textContent='Loading your world…';
    COL=fs.collection('users').doc(u.uid).collection('sections');
    try{
      const snap=await COL.get();
      if(snap.empty){LAST={};flush();toast('Your world is now saved online')}
      else{snap.forEach(d=>{try{const s=d.data().v;LAST[d.id]=s;applyPart(d.id,JSON.parse(s))}catch(e){}});normalize();try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
    }catch(e){toast('Offline – showing what’s saved on this device')}
    COL.onSnapshot(s=>{let ch=false;s.docChanges().forEach(c=>{if(c.doc.metadata.hasPendingWrites)return;const v=c.doc.data().v;if(v&&v!==LAST[c.doc.id]){LAST[c.doc.id]=v;try{applyPart(c.doc.id,JSON.parse(v));ch=true}catch(e){}}});
      if(ch){normalize();try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}applyTheme();if($('#sheetWrap').classList.contains('hidden'))render()}},()=>{});
    gate.classList.add('hidden');applyTheme();render();
  });
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
